name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  swarm:
    runs-on: ubuntu-latest
    env:
      SWARMS_TELEMETRY_ON: "false"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional swarm engine
        run: pip install -e ".[dev,swarm]"
      - name: Verify swarm and real Swarms adapter without provider calls
        run: python -m pytest tests/test_swarm.py -q

  discover:
    runs-on: ubuntu-latest
    env:
      # Keys come from repository secrets (Settings → Secrets → Actions).
      # Without a key a provider is simply skipped — the job does not fail.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Discover free models
        run: python -m scripts.free_models
