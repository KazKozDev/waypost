# Static manifest (source A).
#
# What lives here cannot be learned programmatically: free-tier presence,
# data policy, license. Revised by hand — about once a month.
#
# limits — starting values from documentation. Real limits
# are refined by scripts/probe.py from x-ratelimit-* headers..
#
# IMPORTANT: trains_on_data is the price of a free tier. The default
# is true, because an error this way is safe. Set false only
# if you checked the specific provider's terms.
#
# IMPORTANT: free is a paidness declaration. The field is required at the
# provider (or model) level. Not declared — the model is treated as PAID and
# under free_only=true is not used at all: a silent "probably free"
# is paid for with money. The declaration is verified by a mechanism
# (waypost/pricing.py): prices from GET /models and the actual bill in the
# response outweigh the manifest and can demote a model to paid on the fly.
#
# Free models marked in OpenRouter with the ':free' suffix are discovered
# by the server itself at startup (waypost/discovery.py) — the manifest
# here only sets the starting set and the data policy.
#
# Provider-level fields:
#   api_key_env    primary key; extras — suffixes _2 … _5
#                  in the environment or the api_key_envs list here
#   prompt_cache   auto (prefix cache turns on by itself) | explicit
#                  (needs a cache_control marker) | none
#   concurrency    parallel-request cap (for a local model —
#                  not tuning, but Mac Studio memory protection)

providers:
  # ------------------------------------------------------------- MLX LM (Primary Local)
  - name: mlx
    base_url: http://127.0.0.1:8081/v1    # mlx_lm.server
    is_local: true
    trains_on_data: false
    free: true
    concurrency: 1
    prompt_cache: auto
    models:
      - id: mlx-community/Qwen3.6-27B-4bit
        tier: L
        ctx_window: 32768
        max_output: 8192
        caps: [tools, json, stream]
        quality_score: 0.82
        ttft_p50_ms: 450
        weight: 1.0

  # ------------------------------------------------------------ OpenRouter
  # Freeness is visible in the API (pricing.prompt == "0" / :free suffix) —
  # discovery.py adds new :free models automatically.
